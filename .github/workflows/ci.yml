name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bundle exec brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github


  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-trixie
        env:
          POSTGRES_USER: datawires
          POSTGRES_PASSWORD: datawires
          POSTGRES_DB: datawires_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datawires -d datawires_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: datawires
      DATABASE_PASSWORD: datawires
      DATABASE_NAME: datawires_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Load isolated test schema (without seed fixtures)
        run: bin/rails db:schema:load

      - name: Run RSpec
        run: bundle exec rspec

  container_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify runtime versions match
        run: |
          set -euo pipefail
          ruby_version="$(cat .ruby-version)"
          grep -Fx "ARG RUBY_VERSION=${ruby_version}" Dockerfile
          grep -Fx "ARG RUBY_VERSION=${ruby_version}" .devcontainer/Dockerfile

      - name: Verify stable container image tags exist
        run: |
          set -euo pipefail
          docker buildx imagetools inspect docker.io/library/ruby:4.0.10-slim >/dev/null
          docker buildx imagetools inspect mcr.microsoft.com/devcontainers/base:ubuntu26.04 >/dev/null
          docker buildx imagetools inspect docker.io/library/postgres:16.16-trixie >/dev/null
          docker buildx imagetools inspect docker.io/library/postgres:17.12-trixie >/dev/null

      - name: Validate development Compose specification
        run: docker compose -f .devcontainer/docker-compose.yml config --quiet
