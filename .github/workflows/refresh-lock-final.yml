name: Finalize updated Gemfile lock
on:
  push:
    branches:
      - feature/board-contextual-document-creation
    paths:
      - .github/workflows/refresh-lock-final.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/board-contextual-document-creation
          persist-credentials: true
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false
      - run: bundle update
      - run: bundle check
      - name: Commit verified dependency lock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Gemfile.lock; then
            git add Gemfile.lock
            git commit -m "Regenerate lockfile for integrated SimpleCov formatter"
            git push origin HEAD:feature/board-contextual-document-creation
          fi
